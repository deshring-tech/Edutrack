name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — a queue of stale builds helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    env:
      # CI uses SQLite: the suite covers domain logic and authorization rules,
      # neither of which is provider-specific. Postgres-specific behaviour is
      # exercised in the staging deploy, not here.
      DATABASE_URL: file:./ci.db
      SESSION_SECRET: ci-session-secret-that-is-long-enough-to-pass
      CRON_SECRET: ci-cron-secret-long-enough
      APP_URL: http://localhost:3000
      NOTIFICATION_CHANNEL: CONSOLE

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      # The authorization tests assert against real rows, so the database must
      # be seeded before they run.
      - name: Seed database
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
