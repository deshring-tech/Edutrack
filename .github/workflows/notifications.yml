name: Dispatch notifications

# WHY THIS EXISTS
#  Vercel's Hobby plan allows cron only once per day, which is useless for
#  telling a parent their child was absent this morning. This workflow calls the
#  same endpoint on demand, and can be put on a schedule.
#
# THE SCHEDULE IS DELIBERATELY OFF BY DEFAULT — READ BEFORE ENABLING
#  GitHub bills Actions on PRIVATE repositories per minute, rounded UP per job.
#  A run every 10 minutes is 144 jobs/day, which rounds to ~4,300 minutes a
#  month against a 2,000-minute free allowance. It would quietly exhaust the
#  allowance and start costing money, with CI competing for what is left.
#
#  Pick one:
#
#  1. RECOMMENDED — an external HTTP cron service (cron-job.org, EasyCron,
#     Cloudflare Workers Cron). Free, minute-level granularity, consumes no
#     Actions minutes. Point it at:
#         GET  https://your-app.vercel.app/api/cron/notifications
#         Header: Authorization: Bearer <CRON_SECRET>
#
#  2. Vercel Pro — set vercel.json to "*/2 * * * *" and use platform cron. One
#     scheduler, more punctual than GitHub's.
#
#  3. This workflow on a schedule — uncomment the `schedule` block below. Keep
#     the interval at 30 minutes or longer, and watch your Actions usage under
#     Settings -> Billing.
#
#  Do NOT run two schedulers at once. The outbox claims rows with a
#  read-then-update, which is only safe for a single dispatcher.
#
# REQUIRED REPOSITORY SECRETS (Settings -> Secrets and variables -> Actions):
#   APP_URL      https://your-deployment.vercel.app
#   CRON_SECRET  the same value set in the deployment's environment

on:
  # schedule:
  #   - cron: "*/30 * * * *"

  # Flush the queue by hand from the Actions tab — useful for debugging, and
  # the only trigger enabled by default.
  workflow_dispatch:

concurrency:
  group: dispatch-notifications
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Drain the notification outbox
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set — skipping."
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 0
          fi

          # --fail-with-body so a non-2xx exits non-zero AND still prints the
          # body, which is what tells you whether it was auth or the app.
          curl --silent --show-error --fail-with-body \
            --max-time 120 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/notifications"
